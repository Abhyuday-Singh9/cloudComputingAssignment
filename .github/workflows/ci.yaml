name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      test_model:
        description: "Model predictions to evaluate (trained or untrained)"
        required: false
        default: "trained"
        type: choice
        options:
          - trained
          - untrained

jobs:
  secret_scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Linting
    runs-on: ubuntu-latest
    needs: secret_scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Lint with Flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 service/ tests/ tools/ --max-line-length=120 --statistics

  unit_tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest fastapi pydantic uvicorn httpx

      - name: Run Stateless NACL Simulation
        run: |
          python tools/nacl_sim.py network/nacl.json network/packets_sample.jsonl --check

      - name: Run Service Unit Tests (7 tests)
        run: |
          pytest tests/test_service.py -v

  quality_gate:
    name: Model Quality Gate
    runs-on: ubuntu-latest
    needs: unit_tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Model Evaluation and Quality Gate
        run: |
          PREDS_FILE="results/student_preds.jsonl"
          if [ "${{ github.event.inputs.test_model }}" = "untrained" ]; then
            echo "Evaluating deliberately untrained model to test failure gate..."
            PREDS_FILE="results/untrained_preds.jsonl"
          fi
          python tools/score.py "$PREDS_FILE" data/validation.jsonl --min-validity 95
