apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: data
  labels:
    app: seaweedfs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:latest
          command:
            - weed
            - server
            - -dir=/data
            - -s3
            - -s3.port=8333
            - -filer=true
          ports:
            - name: s3
              containerPort: 8333
            - name: filer
              containerPort: 8888
            - name: master
              containerPort: 9333
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: data-storage
              mountPath: /data
      volumes:
        - name: data-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: data
  labels:
    app: seaweedfs
spec:
  type: ClusterIP
  selector:
    app: seaweedfs
  ports:
    - name: s3
      port: 8333
      targetPort: 8333
    - name: filer
      port: 8888
      targetPort: 8888
    - name: master
      port: 9333
      targetPort: 9333
