apiVersion: batch/v1
kind: Job
metadata:
  name: teacher-worker-0
  namespace: pipeline
spec:
  template:
    metadata:
      name: teacher-worker-0
    spec:
      restartPolicy: OnFailure
      containers:
        - name: worker
          image: worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SHARD_INDEX
              value: "0"
            - name: SHARD_COUNT
              value: "2"
            - name: OLLAMA_HOST
              value: "http://host.docker.internal:11434"
            - name: S3_ENDPOINT
              value: "http://seaweedfs.data.svc.cluster.local:8333"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: AWS_SECRET_ACCESS_KEY
---
apiVersion: batch/v1
kind: Job
metadata:
  name: teacher-worker-1
  namespace: pipeline
spec:
  template:
    metadata:
      name: teacher-worker-1
    spec:
      restartPolicy: OnFailure
      containers:
        - name: worker
          image: worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SHARD_INDEX
              value: "1"
            - name: SHARD_COUNT
              value: "2"
            - name: OLLAMA_HOST
              value: "http://host.docker.internal:11434"
            - name: S3_ENDPOINT
              value: "http://seaweedfs.data.svc.cluster.local:8333"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: AWS_SECRET_ACCESS_KEY
